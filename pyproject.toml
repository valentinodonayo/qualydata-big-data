[project]
name = "qualydata"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "duckdb>=2.0.0",
    "hdbscan>=0.8.44",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "umap-learn>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
